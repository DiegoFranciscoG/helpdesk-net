name: Front en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - src/Helpdesk.Web/**
      - src/Helpdesk.Contracts/**
      - src/Helpdesk.Domain/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Publicar Blazor WebAssembly
    runs-on: ubuntu-24.04
    # Sin la URL pública de la API (variable del repositorio) no hay nada que publicar todavía.
    if: vars.HELPDESK_API_URL != ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: dotnet publish
        run: dotnet publish src/Helpdesk.Web/Helpdesk.Web.csproj -c Release -o out
      - name: Adaptar a GitHub Pages (subruta, rutas del SPA y URL de la API)
        env:
          API_URL: ${{ vars.HELPDESK_API_URL }}
        run: |
          # Solo un origen https: el valor termina en la CSP y en appsettings.json.
          printf '%s' "$API_URL" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?$' \
            || { echo "HELPDESK_API_URL debe ser un origen https, p. ej. https://helpdesk-net-api.onrender.com"; exit 1; }
          site=out/wwwroot
          base="/${GITHUB_REPOSITORY#*/}/"
          sed -i "s|<base href=\"/\" />|<base href=\"$base\" />|" "$site/index.html"
          printf '{"Api":{"BaseUrl":"%s"}}\n' "$API_URL" > "$site/appsettings.json"
          rm -f "$site/appsettings.json.br" "$site/appsettings.json.gz" "$site/index.html.br" "$site/index.html.gz"
          # Enlaces directos (/tickets/...): Pages responde 404.html, que arranca la misma app y enruta Blazor.
          cp "$site/index.html" "$site/404.html"
          # Sin Jekyll: si no, Pages ignora la carpeta _framework.
          touch "$site/.nojekyll"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out/wwwroot

  deploy:
    name: Desplegar
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
